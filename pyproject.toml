[project]
name = "gravitational-wave-analysis"
version = "0.1.0"
description = "Research starter for gravitational-wave signals using public GWOSC data"
requires-python = ">=3.12,<3.15"
dependencies = [
  "gwpy>=4.0,<5",
  "gwosc>=0.8,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.scripts]
gw-plot = "gwresearch.plot:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
